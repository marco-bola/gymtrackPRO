<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymTrack">
<meta name="theme-color" content="#0a0a0f">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>GymTrack PRO</title>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #141420;
  --bg-card: #1a1a2e;
  --bg-card-hover: #22223a;
  --bg-input: #12121e;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --accent-glow: rgba(108, 92, 231, 0.3);
  --green: #00e676;
  --green-dim: rgba(0, 230, 118, 0.15);
  --red: #ff5252;
  --red-dim: rgba(255, 82, 82, 0.15);
  --orange: #ffab40;
  --orange-dim: rgba(255, 171, 64, 0.15);
  --yellow: #ffd740;
  --text-primary: #eaeaff;
  --text-secondary: #8888aa;
  --text-muted: #555570;
  --border: #2a2a44;
  --radius: 14px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  padding-top: var(--safe-top);
  padding-bottom: calc(70px + var(--safe-bottom));
}
input, select, textarea, button { font-family: inherit; }
button { cursor:pointer; border:none; background:none; color:inherit; }

/* ===== SCREENS ===== */
.screen { display:none; padding: 16px; padding-bottom: 90px; animation: fadeIn .25s ease; }
.screen.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed; bottom:0; left:0; right:0;
  background: rgba(10,10,15,0.92);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display:flex; justify-content:space-around; align-items:center;
  padding: 8px 0 calc(8px + var(--safe-bottom));
  z-index:1000;
}
.nav-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; color:var(--text-muted); transition: color .2s;
  padding:4px 12px;
}
.nav-btn.active { color:var(--accent-light); }
.nav-btn svg { width:24px; height:24px; }

/* ===== HEADERS ===== */
.page-header {
  font-size:22px; font-weight:800; margin-bottom:16px;
  background: linear-gradient(135deg, var(--accent-light), var(--accent));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.sub-header { font-size:13px; color:var(--text-secondary); margin-bottom:16px; }

/* ===== CARDS ===== */
.workout-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
  transition: all .2s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.workout-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0;
  width:4px; background: var(--accent);
}
.workout-card:active { transform: scale(0.98); background: var(--bg-card-hover); }
.workout-card .wc-title { font-size:17px; font-weight:700; margin-bottom:4px; }
.workout-card .wc-subtitle { font-size:13px; color:var(--text-secondary); margin-bottom:8px; }
.workout-card .wc-meta { display:flex; gap:12px; flex-wrap:wrap; }
.workout-card .wc-badge {
  font-size:11px; padding:4px 10px; border-radius:20px;
  background: var(--accent-glow); color: var(--accent-light);
}

/* ===== EXERCISE LIST ===== */
.exercise-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}
.exercise-header {
  padding: 14px 16px;
  display:flex; justify-content:space-between; align-items:center;
  cursor: pointer;
}
.exercise-header .ex-left { flex:1; }
.exercise-header .ex-name { font-size:15px; font-weight:600; margin-bottom:2px; }
.exercise-header .ex-muscle { font-size:11px; color:var(--text-muted); }
.exercise-header .ex-chevron {
  color:var(--text-muted); transition:transform .3s; font-size:18px;
}
.exercise-header .ex-chevron.open { transform:rotate(180deg); }

.exercise-body { display:none; padding:0 16px 14px; }
.exercise-body.open { display:block; }

.ex-last-info {
  background: var(--bg-secondary);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--text-secondary);
}
.ex-last-info .info-label { color:var(--text-muted); font-size:10px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
.ex-last-info .info-row { display:flex; gap:16px; flex-wrap:wrap; }
.ex-last-info .info-val { color:var(--text-primary); font-weight:600; }

.ex-metrics {
  display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;
}
.ex-metric {
  flex:1; min-width:70px;
  background: var(--bg-secondary);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  text-align:center;
}
.ex-metric .m-label { font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.3px; }
.ex-metric .m-value { font-size:14px; font-weight:700; margin-top:2px; }
.ex-metric .m-sub { font-size:10px; color:var(--text-muted); margin-top:1px; }

/* ===== SERIES TABLE ===== */
.series-table { width:100%; margin-bottom:10px; }
.series-row {
  display:flex; align-items:center; gap:6px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(42,42,68,0.5);
}
.series-row:last-child { border-bottom:none; }
.series-num {
  width:28px; height:28px; border-radius:50%;
  background:var(--bg-secondary); display:flex; align-items:center;
  justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;
}
.series-num.warmup { background:var(--orange-dim); color:var(--orange); }
.series-num.done-set { background:var(--green-dim); color:var(--green); }
.series-input {
  width:60px; padding:8px 6px; border-radius:8px;
  border:1px solid var(--border); background:var(--bg-input);
  color:var(--text-primary); font-size:15px; font-weight:600;
  text-align:center; outline:none; transition: border-color .2s;
}
.series-input:focus { border-color:var(--accent); }
.series-input::placeholder { color:var(--text-muted); font-size:12px; }
.series-label { font-size:11px; color:var(--text-muted); flex-shrink:0; }
.series-ref { font-size:10px; color:var(--text-muted); margin-left:auto; white-space:nowrap; }

.warmup-toggle {
  display:flex; align-items:center; gap:4px;
  padding:4px 8px; border-radius:6px; font-size:10px;
  color:var(--text-muted); transition: all .2s; flex-shrink:0;
}
.warmup-toggle.active { background:var(--orange-dim); color:var(--orange); }

.done-btn {
  width:32px; height:32px; border-radius:50%;
  border:2px solid var(--border); display:flex; align-items:center;
  justify-content:center; font-size:14px; transition:all .2s; flex-shrink:0;
}
.done-btn.checked { border-color:var(--green); background:var(--green-dim); color:var(--green); }

/* ===== TIMER ===== */
.timer-bar {
  position:fixed; top:0; left:0; right:0;
  background:rgba(10,10,15,0.95); backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding: calc(var(--safe-top) + 8px) 16px 10px;
  z-index:999; display:none; border-bottom:1px solid var(--border);
}
.timer-bar.active { display:flex; align-items:center; gap:12px; }
.timer-display {
  font-size:28px; font-weight:800; font-variant-numeric:tabular-nums;
  min-width:70px;
}
.timer-display.warning { color:var(--orange); }
.timer-display.danger { color:var(--red); animation: pulse .5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.timer-controls { display:flex; gap:6px; margin-left:auto; }
.timer-ctrl-btn {
  padding:6px 14px; border-radius:8px; font-size:13px; font-weight:600;
}
.timer-ctrl-btn.primary { background:var(--accent); color:#fff; }
.timer-ctrl-btn.secondary { background:var(--bg-card); color:var(--text-secondary); border:1px solid var(--border); }
.timer-preset-row { display:flex; gap:6px; }
.timer-preset {
  padding:4px 10px; border-radius:6px; font-size:12px; font-weight:600;
  background:var(--bg-card); color:var(--text-secondary);
  border:1px solid var(--border);
}
.timer-preset.active { border-color:var(--accent); color:var(--accent-light); background:var(--accent-glow); }

/* ===== CALORIE INPUT ===== */
.session-cal {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 16px; margin-bottom:12px;
  display:flex; align-items:center; gap:10px;
}
.session-cal .cal-icon { font-size:22px; }
.session-cal input {
  flex:1; padding:8px 10px; border-radius:8px;
  border:1px solid var(--border); background:var(--bg-input);
  color:var(--text-primary); font-size:15px; outline:none;
}
.session-cal input:focus { border-color:var(--accent); }
.session-cal .cal-unit { font-size:12px; color:var(--text-muted); }

/* ===== FINISH BTN ===== */
.finish-btn {
  width:100%; padding:16px; border-radius:var(--radius);
  background: linear-gradient(135deg, var(--green), #00c853);
  color:#000; font-size:16px; font-weight:700;
  margin-top:16px; transition: transform .15s;
}
.finish-btn:active { transform:scale(0.97); }

/* ===== SETTINGS / EDIT ===== */
.edit-section {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px; margin-bottom:12px;
}
.edit-section-title { font-size:14px; font-weight:700; margin-bottom:12px; }
.edit-row {
  display:flex; align-items:center; gap:10px;
  padding:10px 0; border-bottom:1px solid rgba(42,42,68,.4);
}
.edit-row:last-child { border-bottom:none; }
.edit-row .er-name { flex:1; font-size:14px; }
.edit-row .er-actions { display:flex; gap:6px; }

.icon-btn {
  width:36px; height:36px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg-secondary); color:var(--text-secondary);
  font-size:16px; transition: all .2s;
}
.icon-btn:active { background:var(--accent-glow); color:var(--accent-light); }
.icon-btn.danger:active { background:var(--red-dim); color:var(--red); }

.add-btn {
  display:flex; align-items:center; justify-content:center; gap:6px;
  width:100%; padding:12px; border-radius:var(--radius-sm);
  border:1px dashed var(--border); color:var(--text-muted);
  font-size:13px; margin-top:10px; transition: all .2s;
}
.add-btn:active { border-color:var(--accent); color:var(--accent-light); }

/* ===== HISTORY ===== */
.history-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
}
.history-card .hc-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.history-card .hc-date { font-size:14px; font-weight:600; }
.history-card .hc-cal { font-size:11px; color:var(--orange); }
.history-card .hc-exercises { font-size:12px; color:var(--text-secondary); }
.history-card .hc-vol { font-size:11px; color:var(--text-muted); margin-top:4px; }

/* ===== MODAL ===== */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.7);
  z-index:2000; display:none; align-items:flex-end; justify-content:center;
}
.modal-overlay.active { display:flex; }
.modal-sheet {
  width:100%; max-width:500px; max-height:85vh;
  background:var(--bg-secondary); border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + var(--safe-bottom));
  overflow-y:auto; animation: slideUp .3s ease;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-handle {
  width:40px; height:4px; border-radius:4px;
  background:var(--text-muted); margin:0 auto 16px;
}
.modal-title { font-size:18px; font-weight:700; margin-bottom:16px; }

.muscle-filter {
  display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;
}
.muscle-chip {
  padding:6px 12px; border-radius:20px; font-size:12px;
  background:var(--bg-card); color:var(--text-secondary);
  border:1px solid var(--border); transition: all .2s;
}
.muscle-chip.active {
  background:var(--accent-glow); color:var(--accent-light);
  border-color:var(--accent);
}

.ex-select-item {
  display:flex; align-items:center; gap:10px;
  padding:12px; border-radius:var(--radius-sm);
  background:var(--bg-card); border:1px solid var(--border);
  margin-bottom:6px; cursor:pointer; transition: all .2s;
}
.ex-select-item:active { background:var(--bg-card-hover); border-color:var(--accent); }
.ex-select-item .esi-name { font-size:14px; font-weight:500; }
.ex-select-item .esi-muscle { font-size:11px; color:var(--text-muted); }

.modal-input {
  width:100%; padding:12px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--bg-input);
  color:var(--text-primary); font-size:15px; outline:none;
  margin-bottom:10px;
}
.modal-input:focus { border-color:var(--accent); }

.modal-btn {
  width:100%; padding:14px; border-radius:var(--radius-sm);
  font-size:15px; font-weight:700; margin-top:6px;
}
.modal-btn.primary { background:var(--accent); color:#fff; }
.modal-btn.secondary { background:var(--bg-card); color:var(--text-secondary); border:1px solid var(--border); }
.modal-btn.danger { background:var(--red-dim); color:var(--red); border:1px solid rgba(255,82,82,.3); }

/* ===== CONFIRM DIALOG ===== */
.confirm-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.7);
  z-index:3000; display:none; align-items:center; justify-content:center;
}
.confirm-overlay.active { display:flex; }
.confirm-box {
  background:var(--bg-secondary); border-radius:var(--radius);
  padding:24px 20px; max-width:320px; width:90%; text-align:center;
}
.confirm-box p { font-size:15px; margin-bottom:16px; }
.confirm-actions { display:flex; gap:10px; }
.confirm-actions button { flex:1; padding:12px; border-radius:10px; font-weight:600; font-size:14px; }

/* ===== UTILS ===== */
.text-green { color:var(--green); }
.text-red { color:var(--red); }
.text-orange { color:var(--orange); }
.text-muted { color:var(--text-muted); }
.mt-8 { margin-top:8px; }
.mb-12 { margin-bottom:12px; }
.hidden { display:none !important; }

/* ===== EDIT EXERCISE DETAILS ===== */
.edit-ex-field {
  display:flex; align-items:center; gap:10px; margin-bottom:10px;
}
.edit-ex-field label {
  font-size:12px; color:var(--text-secondary); min-width:60px;
}
.edit-ex-field input, .edit-ex-field select {
  flex:1; padding:10px; border-radius:8px;
  border:1px solid var(--border); background:var(--bg-input);
  color:var(--text-primary); font-size:14px; outline:none;
}
.edit-ex-field input:focus, .edit-ex-field select:focus {
  border-color:var(--accent);
}

/* ===== DRAG HANDLE ===== */
.drag-handle {
  color:var(--text-muted); cursor:grab; font-size:18px;
  padding:4px; user-select:none;
}
.dragging { opacity:.5; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
</style>
</head>
<body>

<!-- ===== TIMER BAR ===== -->
<div class="timer-bar" id="timerBar">
  <div class="timer-display" id="timerDisplay">01:30</div>
  <div class="timer-preset-row">
    <button class="timer-preset" data-seconds="60" onclick="setTimerPreset(60)">1:00</button>
    <button class="timer-preset active" data-seconds="90" onclick="setTimerPreset(90)">1:30</button>
    <button class="timer-preset" data-seconds="120" onclick="setTimerPreset(120)">2:00</button>
    <button class="timer-preset" data-seconds="180" onclick="setTimerPreset(180)">3:00</button>
  </div>
  <div class="timer-controls">
    <button class="timer-ctrl-btn secondary" id="timerResetBtn" onclick="resetTimer()">↻</button>
    <button class="timer-ctrl-btn primary" id="timerPlayBtn" onclick="toggleTimer()">▶</button>
    <button class="timer-ctrl-btn secondary" onclick="closeTimer()">✕</button>
  </div>
</div>

<!-- ===== SCREEN: HOME ===== -->
<div class="screen active" id="screenHome">
  <div class="page-header">🏋️ GymTrack PRO</div>
  <div class="sub-header">Selecione o treino do dia</div>
  <div id="workoutList"></div>
</div>

<!-- ===== SCREEN: WORKOUT EXECUTION ===== -->
<div class="screen" id="screenWorkout">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
    <button class="icon-btn" onclick="goHome()" style="flex-shrink:0;">←</button>
    <div class="page-header" id="workoutTitle" style="margin-bottom:0;flex:1;">Treino A</div>
  </div>
  <div class="sub-header" id="workoutSubtitle"></div>
  <div id="exerciseList"></div>
  <div class="session-cal">
    <span class="cal-icon">🔥</span>
    <input type="number" id="sessionCalories" placeholder="Energia (Apple Watch)" inputmode="decimal">
    <span class="cal-unit">kcal</span>
  </div>
  <button class="finish-btn" onclick="finishWorkout()">✓ Finalizar Treino</button>
</div>

<!-- ===== SCREEN: HISTORY ===== -->
<div class="screen" id="screenHistory">
  <div class="page-header">📊 Histórico</div>
  <div class="sub-header">Sessões anteriores</div>
  <div id="historyList"></div>
</div>

<!-- ===== SCREEN: EDIT ===== -->
<div class="screen" id="screenEdit">
  <div class="page-header">⚙️ Montar Treino</div>
  <div class="sub-header">Edite divisões e exercícios</div>
  <div id="editWorkoutList"></div>
  <button class="add-btn" onclick="addWorkoutDivision()">+ Adicionar Divisão de Treino</button>
</div>

<!-- ===== EXERCISE SELECTION MODAL ===== -->
<div class="modal-overlay" id="modalExSelect">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Selecionar Exercício</div>
    <input class="modal-input" id="exSearchInput" placeholder="Buscar exercício..." oninput="filterExercises()">
    <div class="muscle-filter" id="muscleFilter"></div>
    <div id="exSelectList"></div>
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
      <div class="modal-title" style="font-size:15px;">Criar Novo Exercício</div>
      <input class="modal-input" id="newExName" placeholder="Nome do exercício">
      <select class="modal-input" id="newExMuscle"></select>
      <button class="modal-btn primary" onclick="createExercise()">+ Criar e Adicionar</button>
    </div>
    <button class="modal-btn secondary" style="margin-top:8px;" onclick="closeModal('modalExSelect')">Cancelar</button>
  </div>
</div>

<!-- ===== EDIT EXERCISE MODAL ===== -->
<div class="modal-overlay" id="modalEditEx">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="editExTitle">Editar Exercício</div>
    <div class="edit-ex-field">
      <label>Séries</label>
      <input type="number" id="editExSets" inputmode="numeric" min="1" max="10">
    </div>
    <div class="edit-ex-field">
      <label>Reps</label>
      <input type="text" id="editExReps" placeholder="ex: 10 - 12">
    </div>
    <div class="edit-ex-field">
      <label>RIR</label>
      <input type="text" id="editExRIR" placeholder="ex: 2 - 3">
    </div>
    <div class="edit-ex-field">
      <label>Descanso</label>
      <input type="text" id="editExRest" placeholder="ex: 90s - 120s">
    </div>
    <button class="modal-btn primary" onclick="saveEditExercise()">Salvar</button>
    <button class="modal-btn danger" style="margin-top:8px;" onclick="deleteExercise()">Remover Exercício</button>
    <button class="modal-btn secondary" style="margin-top:8px;" onclick="closeModal('modalEditEx')">Cancelar</button>
  </div>
</div>

<!-- ===== RENAME WORKOUT MODAL ===== -->
<div class="modal-overlay" id="modalRename">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Renomear Treino</div>
    <input class="modal-input" id="renameInput" placeholder="Nome do treino">
    <input class="modal-input" id="renameSubInput" placeholder="Descrição (foco muscular)">
    <button class="modal-btn primary" onclick="saveRenameWorkout()">Salvar</button>
    <button class="modal-btn secondary" style="margin-top:8px;" onclick="closeModal('modalRename')">Cancelar</button>
  </div>
</div>

<!-- ===== CONFIRM DIALOG ===== -->
<div class="confirm-overlay" id="confirmDialog">
  <div class="confirm-box">
    <p id="confirmMsg">Tem certeza?</p>
    <div class="confirm-actions">
      <button class="secondary" style="background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border);" onclick="confirmNo()">Cancelar</button>
      <button class="primary" style="background:var(--red);color:#fff;" onclick="confirmYes()">Confirmar</button>
    </div>
  </div>

// ====================== STATE ======================

let state = {
  workouts: [],
  history: [],
  customExercises: [],
  timerDuration: 90,
};

function loadState() {
  try {
    const s = localStorage.getItem('gymtrack_state');
    if (s) {
      state = JSON.parse(s);
      // Merge new catalog exercises
      if (!state.customExercises) state.customExercises = [];
      if (!state.timerDuration) state.timerDuration = 90;
    } else {
      state.workouts = JSON.parse(JSON.stringify(DEFAULT_WORKOUTS));
    }
  } catch(e) {
    state.workouts = JSON.parse(JSON.stringify(DEFAULT_WORKOUTS));
  }
}

function saveState() {
  localStorage.setItem('gymtrack_state', JSON.stringify(state));
}

// ====================== NAVIGATION ======================

function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.screen === id);
  });
  if (id === 'screenHome') renderHome();
  if (id === 'screenHistory') renderHistory();
  if (id === 'screenEdit') renderEdit();
}

function goHome() {
  switchScreen('screenHome');
}

// ====================== HOME SCREEN ======================

function renderHome() {
  const list = document.getElementById('workoutList');
  list.innerHTML = '';
  state.workouts.forEach((w, i) => {
    const totalSets = w.exercises.reduce((s, e) => s + e.sets, 0);
    const lastSession = getLastSession(w.id);
    const lastStr = lastSession ? `Último: ${formatDate(lastSession.date)}` : 'Nenhum registro';
    list.innerHTML += `
      <div class="workout-card" onclick="startWorkout(${i})">
        <div class="wc-title">${w.name}</div>
        <div class="wc-subtitle">${w.subtitle || ''}</div>
        <div class="wc-meta">
          <span class="wc-badge">${totalSets} séries</span>
          <span class="wc-badge">${w.exercises.length} exercícios</span>
          <span class="wc-badge" style="background:${lastSession ? 'var(--green-dim)' : 'var(--bg-secondary)'};color:${lastSession ? 'var(--green)' : 'var(--text-muted)'}">${lastStr}</span>
        </div>
      </div>`;
  });
}

// ====================== WORKOUT EXECUTION ======================

let currentWorkoutIdx = -1;
let currentSessionData = {};

function startWorkout(idx) {
  currentWorkoutIdx = idx;
  const w = state.workouts[idx];
  document.getElementById('workoutTitle').textContent = w.name;
  document.getElementById('workoutSubtitle').textContent = w.subtitle || '';
  document.getElementById('sessionCalories').value = '';

  currentSessionData = {
    workoutId: w.id,
    workoutName: w.name,
    date: new Date().toISOString(),
    exercises: w.exercises.map(ex => ({
      name: ex.name,
      muscle: ex.muscle,
      sets: Array.from({length: ex.sets}, () => ({kg: '', reps: '', warmup: false, done: false})),
      targetReps: ex.reps,
    })),
    calories: null,
  };

  renderExercises();
  switchScreen('screenWorkout');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
}

function renderExercises() {
  const w = state.workouts[currentWorkoutIdx];
  const list = document.getElementById('exerciseList');
  list.innerHTML = '';

  w.exercises.forEach((ex, ei) => {
    const history = getExerciseHistory(w.id, ex.name);
    const lastData = history.length > 0 ? history[history.length - 1] : null;
    const validHistory = getValidHistoryStats(history);

    let lastInfoHTML = '';
    if (lastData) {
      const setsStr = lastData.sets.map(s => `${s.kg}kg×${s.reps}${s.warmup ? '🔥' : ''}`).join(' | ');
      lastInfoHTML = `
        <div class="ex-last-info">
          <div class="info-label">Último treino (${formatDate(lastData.date)})</div>
          <div class="info-row">${setsStr}</div>
        </div>`;
    }

    let metricsHTML = '';
    if (validHistory.count > 0) {
      metricsHTML = `
        <div class="ex-metrics">
          <div class="ex-metric">
            <div class="m-label">Carga Média</div>
            <div class="m-value">${validHistory.avgKg.toFixed(1)}<span style="font-size:11px;color:var(--text-muted)">kg</span></div>
            <div class="m-sub">${validHistory.count} sessões</div>
          </div>
          <div class="ex-metric">
            <div class="m-label">Reps Média</div>
            <div class="m-value">${validHistory.avgReps.toFixed(1)}</div>
            <div class="m-sub">séries válidas</div>
          </div>
          <div class="ex-metric">
            <div class="m-label">Vol. Total</div>
            <div class="m-value">${validHistory.lastVolume.toFixed(0)}</div>
            <div class="m-sub">kg×reps (últ.)</div>
          </div>
        </div>`;
    }

    let setsHTML = '';
    for (let si = 0; si < ex.sets; si++) {
      const sd = currentSessionData.exercises[ei].sets[si];
      const lastSet = lastData && lastData.sets[si] ? lastData.sets[si] : null;
      const refText = lastSet ? `${lastSet.kg}×${lastSet.reps}` : '';
      setsHTML += `
        <div class="series-row">
          <div class="series-num ${sd.warmup ? 'warmup' : ''} ${sd.done ? 'done-set' : ''}" id="snum-${ei}-${si}">${si + 1}</div>
          <input class="series-input" type="number" inputmode="decimal" step="0.5" placeholder="Kg"
            value="${sd.kg}" onchange="updateSet(${ei},${si},'kg',this.value)" id="kg-${ei}-${si}">
          <span class="series-label">kg</span>
          <input class="series-input" type="number" inputmode="numeric" placeholder="Reps"
            value="${sd.reps}" onchange="updateSet(${ei},${si},'reps',this.value)" id="reps-${ei}-${si}" style="width:50px;">
          <span class="series-label">reps</span>
          <button class="warmup-toggle ${sd.warmup ? 'active' : ''}" onclick="toggleWarmup(${ei},${si})" id="wu-${ei}-${si}" title="Aquecimento">🔥</button>
          <button class="done-btn ${sd.done ? 'checked' : ''}" onclick="toggleDone(${ei},${si})" id="done-${ei}-${si}">✓</button>
          ${refText ? `<span class="series-ref">${refText}</span>` : ''}
        </div>`;
    }

    list.innerHTML += `
      <div class="exercise-item">
        <div class="exercise-header" onclick="toggleExercise(this)">
          <div class="ex-left">
            <div class="ex-name">${ex.name}</div>
            <div class="ex-muscle">${ex.muscle} · ${ex.sets}×${ex.reps} · RIR ${ex.rir} · ⏱ ${ex.rest}</div>
          </div>
          <span class="ex-chevron">▼</span>
        </div>
        <div class="exercise-body open">
          ${lastInfoHTML}
          ${metricsHTML}
          <div class="series-table">${setsHTML}</div>
        </div>
      </div>`;
  });
}

function toggleExercise(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector('.ex-chevron');
  body.classList.toggle('open');
  chevron.classList.toggle('open');
}

function updateSet(ei, si, field, value) {
  if (field === 'kg') currentSessionData.exercises[ei].sets[si].kg = parseFloat(value) || '';
  if (field === 'reps') currentSessionData.exercises[ei].sets[si].reps = parseInt(value) || '';
}

function toggleWarmup(ei, si) {
  const sd = currentSessionData.exercises[ei].sets[si];
  sd.warmup = !sd.warmup;
  const btn = document.getElementById(`wu-${ei}-${si}`);
  btn.classList.toggle('active', sd.warmup);
  const num = document.getElementById(`snum-${ei}-${si}`);
  num.classList.toggle('warmup', sd.warmup);
}

function toggleDone(ei, si) {
  const sd = currentSessionData.exercises[ei].sets[si];
  // Read current input values first
  const kgInput = document.getElementById(`kg-${ei}-${si}`);
  const repsInput = document.getElementById(`reps-${ei}-${si}`);
  sd.kg = parseFloat(kgInput.value) || '';
  sd.reps = parseInt(repsInput.value) || '';

  sd.done = !sd.done;
  const btn = document.getElementById(`done-${ei}-${si}`);
  btn.classList.toggle('checked', sd.done);
  const num = document.getElementById(`snum-${ei}-${si}`);
  num.classList.toggle('done-set', sd.done);

  // Start rest timer when marking set as done
  if (sd.done) {
    showTimer();
    startTimer();
  }
}

function finishWorkout() {
  // Read all current input values
  const w = state.workouts[currentWorkoutIdx];
  w.exercises.forEach((ex, ei) => {
    for (let si = 0; si < ex.sets; si++) {
      const kgInput = document.getElementById(`kg-${ei}-${si}`);
      const repsInput = document.getElementById(`reps-${ei}-${si}`);
      if (kgInput) currentSessionData.exercises[ei].sets[si].kg = parseFloat(kgInput.value) || '';
      if (repsInput) currentSessionData.exercises[ei].sets[si].reps = parseInt(repsInput.value) || '';
    }
  });

  currentSessionData.calories = parseFloat(document.getElementById('sessionCalories').value) || null;
  currentSessionData.date = new Date().toISOString();

  // Only save if at least one set was done
  const anyDone = currentSessionData.exercises.some(e => e.sets.some(s => s.done));
  if (!anyDone) {
    showConfirmDialog('Nenhuma série foi marcada como concluída. Deseja salvar mesmo assim?', () => {
      saveSession();
    });
    return;
  }
  saveSession();
}

function saveSession() {
  state.history.push(JSON.parse(JSON.stringify(currentSessionData)));
  saveState();
  closeTimer();
  goHome();
}

// ====================== TIMER ======================

let timerInterval = null;
let timerRemaining = 90;
let timerRunning = false;

function showTimer() {
  document.getElementById('timerBar').classList.add('active');
  document.body.style.paddingTop = `calc(var(--safe-top) + 60px)`;
}

function closeTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('timerBar').classList.remove('active');
  document.body.style.paddingTop = 'var(--safe-top)';
  document.getElementById('timerPlayBtn').textContent = '▶';
}

function setTimerPreset(seconds) {
  state.timerDuration = seconds;
  timerRemaining = seconds;
  timerRunning = false;
  clearInterval(timerInterval);
  updateTimerDisplay();
  document.getElementById('timerPlayBtn').textContent = '▶';
  document.querySelectorAll('.timer-preset').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.seconds) === seconds);
  });
  saveState();
}

function toggleTimer() {
  if (timerRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  if (timerRunning) {
    clearInterval(timerInterval);
  }
  timerRemaining = state.timerDuration;
  timerRunning = true;
  document.getElementById('timerPlayBtn').textContent = '⏸';
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timerPlayBtn').textContent = '▶';
      timerFinished();
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('timerPlayBtn').textContent = '▶';
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRemaining = state.timerDuration;
  timerRunning = false;
  updateTimerDisplay();
  document.getElementById('timerPlayBtn').textContent = '▶';
}

function updateTimerDisplay() {
  const display = document.getElementById('timerDisplay');
  const mins = Math.floor(timerRemaining / 60);
  const secs = timerRemaining % 60;
  display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  display.className = 'timer-display';
  if (timerRemaining <= 10 && timerRemaining > 0) display.classList.add('danger');
  else if (timerRemaining <= 30) display.classList.add('warning');
}

function timerFinished() {
  // Vibration
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  // Visual flash
  const display = document.getElementById('timerDisplay');
  display.textContent = '00:00';
  display.classList.add('danger');
  // Audio beep
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, start, dur) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.value = 0.3;
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur);
    }
    beep(880, 0, 0.15);
    beep(880, 0.2, 0.15);
    beep(1100, 0.4, 0.3);
  } catch(e) {}
}

// ====================== HISTORY ======================

function getLastSession(workoutId) {
  const sessions = state.history.filter(h => h.workoutId === workoutId);
  return sessions.length > 0 ? sessions[sessions.length - 1] : null;
}

function getExerciseHistory(workoutId, exerciseName) {
  return state.history
    .filter(h => h.workoutId === workoutId)
    .map(h => {
      const ex = h.exercises.find(e => e.name === exerciseName);
      return ex ? { date: h.date, sets: ex.sets } : null;
    })
    .filter(Boolean);
}

function getValidHistoryStats(history) {
  if (history.length === 0) return { count:0, avgKg:0, avgReps:0, lastVolume:0 };
  let totalKg = 0, totalReps = 0, validSets = 0;
  history.forEach(h => {
    h.sets.forEach(s => {
      if (!s.warmup && s.kg && s.reps) {
        totalKg += parseFloat(s.kg);
        totalReps += parseInt(s.reps);
        validSets++;
      }
    });
  });
  // Last session volume
  const lastH = history[history.length - 1];
  let lastVol = 0;
  lastH.sets.forEach(s => {
    if (!s.warmup && s.kg && s.reps) {
      lastVol += parseFloat(s.kg) * parseInt(s.reps);
    }
  });
  return {
    count: history.length,
    avgKg: validSets > 0 ? totalKg / validSets : 0,
    avgReps: validSets > 0 ? totalReps / validSets : 0,
    lastVolume: lastVol,
  };
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (state.history.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px 0;">Nenhum treino registrado ainda.<br>Complete seu primeiro treino!</div>';
    return;
  }
  list.innerHTML = '';
  const sorted = [...state.history].reverse();
  sorted.forEach((h, idx) => {
    const exNames = h.exercises.map(e => e.name).join(', ');
    let totalVol = 0;
    h.exercises.forEach(e => {
      e.sets.forEach(s => {
        if (!s.warmup && s.kg && s.reps) totalVol += parseFloat(s.kg) * parseInt(s.reps);
      });
    });
    const calStr = h.calories ? `🔥 ${h.calories} kcal` : '';
    list.innerHTML += `
      <div class="history-card" onclick="viewHistoryDetail(${state.history.length - 1 - idx})">
        <div class="hc-top">
          <span class="hc-date">${h.workoutName} — ${formatDate(h.date)}</span>
          <span class="hc-cal">${calStr}</span>
        </div>
        <div class="hc-exercises">${exNames}</div>
        <div class="hc-vol">Volume Total: ${totalVol.toFixed(0)} kg×reps</div>
      </div>`;
  });
}

function viewHistoryDetail(idx) {
  const h = state.history[idx];
  if (!h) return;
  let detail = '';
  h.exercises.forEach(e => {
    const setsStr = e.sets.map((s, i) => {
      const badge = s.warmup ? ' 🔥aq' : '';
      return `S${i+1}: ${s.kg || '-'}kg × ${s.reps || '-'}${badge}`;
    }).join(' · ');
    detail += `<div style="margin-bottom:8px;"><strong>${e.name}</strong><br><span style="font-size:12px;color:var(--text-secondary);">${setsStr}</span></div>`;
  });
  if (h.calories) detail += `<div style="margin-top:12px;color:var(--orange);">🔥 Gasto energético: ${h.calories} kcal</div>`;

  const modal = document.getElementById('modalExSelect');
  const sheet = modal.querySelector('.modal-sheet');
  sheet.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${h.workoutName} — ${formatDate(h.date)}</div>
    ${detail}
    <button class="modal-btn secondary" style="margin-top:14px;" onclick="closeModal('modalExSelect');renderHistory();">Fechar</button>
    <button class="modal-btn danger" style="margin-top:8px;" onclick="deleteHistory(${idx})">Excluir Sessão</button>
  `;
  modal.classList.add('active');
}

function deleteHistory(idx) {
  showConfirmDialog('Excluir esta sessão do histórico?', () => {
    state.history.splice(idx, 1);
    saveState();
    closeModal('modalExSelect');
    renderHistory();
    // Rebuild modal content
    rebuildExSelectModal();
  });
}

function rebuildExSelectModal() {
  const modal = document.getElementById('modalExSelect');
  const sheet = modal.querySelector('.modal-sheet');
  sheet.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">Selecionar Exercício</div>
    <input class="modal-input" id="exSearchInput" placeholder="Buscar exercício..." oninput="filterExercises()">
    <div class="muscle-filter" id="muscleFilter"></div>
    <div id="exSelectList"></div>
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
      <div class="modal-title" style="font-size:15px;">Criar Novo Exercício</div>
      <input class="modal-input" id="newExName" placeholder="Nome do exercício">
      <select class="modal-input" id="newExMuscle"></select>
      <button class="modal-btn primary" onclick="createExercise()">+ Criar e Adicionar</button>
    </div>
    <button class="modal-btn secondary" style="margin-top:8px;" onclick="closeModal('modalExSelect')">Cancelar</button>
  `;
}

// ====================== EDIT SCREEN ======================

let editWorkoutIdx = -1;
let editExerciseIdx = -1;

function renderEdit() {
  const list = document.getElementById('editWorkoutList');
  list.innerHTML = '';
  state.workouts.forEach((w, wi) => {
    let exRows = '';
    w.exercises.forEach((ex, ei) => {
      exRows += `
        <div class="edit-row">
          <span class="drag-handle" title="Arrastar">⠿</span>
          <span class="er-name">${ex.name}<br><span style="font-size:10px;color:var(--text-muted)">${ex.muscle} · ${ex.sets}×${ex.reps}</span></span>
          <div class="er-actions">
            <button class="icon-btn" onclick="openEditExercise(${wi},${ei})">✎</button>
          </div>
        </div>`;
    });
    list.innerHTML += `
      <div class="edit-section">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
          <div class="edit-section-title" style="flex:1;margin-bottom:0;">${w.name}</div>
          <button class="icon-btn" onclick="renameWorkout(${wi})" title="Renomear">✎</button>
          <button class="icon-btn danger" onclick="deleteWorkout(${wi})" title="Excluir">✕</button>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;">${w.subtitle || ''}</div>
        ${exRows}
        <button class="add-btn" onclick="openAddExercise(${wi})">+ Adicionar Exercício</button>
      </div>`;
  });
}

function addWorkoutDivision() {
  const letters = 'ABCDEFGHIJ';
  const nextLetter = letters[state.workouts.length] || 'X';
  state.workouts.push({
    id: nextLetter + Date.now(),
    name: `Treino ${nextLetter}`,
    subtitle: 'Novo treino',
    exercises: [],
  });
  saveState();
  renderEdit();
}

function deleteWorkout(wi) {
  showConfirmDialog(`Excluir "${state.workouts[wi].name}"? O histórico será mantido.`, () => {
    state.workouts.splice(wi, 1);
    saveState();
    renderEdit();
  });
}

function renameWorkout(wi) {
  editWorkoutIdx = wi;
  document.getElementById('renameInput').value = state.workouts[wi].name;
  document.getElementById('renameSubInput').value = state.workouts[wi].subtitle || '';
  document.getElementById('modalRename').classList.add('active');
}

function saveRenameWorkout() {
  const name = document.getElementById('renameInput').value.trim();
  const sub = document.getElementById('renameSubInput').value.trim();
  if (name) state.workouts[editWorkoutIdx].name = name;
  state.workouts[editWorkoutIdx].subtitle = sub;
  saveState();
  closeModal('modalRename');
  renderEdit();
}

// ===== ADD EXERCISE MODAL =====
let addToWorkoutIdx = -1;
let selectedMuscleFilter = '';

function openAddExercise(wi) {
  addToWorkoutIdx = wi;
  rebuildExSelectModal();
  selectedMuscleFilter = '';
  buildMuscleFilter();
  buildExerciseSelectList();
  document.getElementById('modalExSelect').classList.add('active');
}

function buildMuscleFilter() {
  const container = document.getElementById('muscleFilter');
  if (!container) return;
  container.innerHTML = MUSCLE_GROUPS.map(m =>
    `<button class="muscle-chip ${selectedMuscleFilter === m ? 'active' : ''}" onclick="toggleMuscleFilter('${m}')">${m}</button>`
  ).join('');
}

function toggleMuscleFilter(muscle) {
  selectedMuscleFilter = selectedMuscleFilter === muscle ? '' : muscle;
  buildMuscleFilter();
  buildExerciseSelectList();
}

function buildExerciseSelectList() {
  const container = document.getElementById('exSelectList');
  if (!container) return;
  const searchInput = document.getElementById('exSearchInput');
  const search = searchInput ? searchInput.value.toLowerCase() : '';
  const allExercises = [...EXERCISE_CATALOG, ...state.customExercises];
  const filtered = allExercises.filter(e => {
    if (selectedMuscleFilter && e.muscle !== selectedMuscleFilter) return false;
    if (search && !e.name.toLowerCase().includes(search)) return false;
    return true;
  });
  container.innerHTML = filtered.map(e =>
    `<div class="ex-select-item" onclick="addExerciseToWorkout('${e.name.replace(/'/g, "\\'")}','${e.muscle}')">
      <div><div class="esi-name">${e.name}</div><div class="esi-muscle">${e.muscle}</div></div>
    </div>`
  ).join('');
}

function filterExercises() {
  buildExerciseSelectList();
}

function addExerciseToWorkout(name, muscle) {
  state.workouts[addToWorkoutIdx].exercises.push({
    name, muscle, sets:3, reps:'10 - 12', rir:'2 - 3', rest:'90s'
  });
  saveState();
  closeModal('modalExSelect');
  renderEdit();
}

function createExercise() {
  const nameInput = document.getElementById('newExName');
  const muscleInput = document.getElementById('newExMuscle');
  if (!nameInput || !muscleInput) return;
  const name = nameInput.value.trim();
  const muscle = muscleInput.value;
  if (!name) return;
  state.customExercises.push({ name, muscle });
  addExerciseToWorkout(name, muscle);
}

function populateNewExMuscleSelect() {
  const sel = document.getElementById('newExMuscle');
  if (!sel) return;
  sel.innerHTML = MUSCLE_GROUPS.map(m => `<option value="${m}">${m}</option>`).join('');
}

// ===== EDIT EXERCISE MODAL =====

function openEditExercise(wi, ei) {
  editWorkoutIdx = wi;
  editExerciseIdx = ei;
  const ex = state.workouts[wi].exercises[ei];
  document.getElementById('editExTitle').textContent = ex.name;
  document.getElementById('editExSets').value = ex.sets;
  document.getElementById('editExReps').value = ex.reps;
  document.getElementById('editExRIR').value = ex.rir;
  document.getElementById('editExRest').value = ex.rest;
  document.getElementById('modalEditEx').classList.add('active');
}

function saveEditExercise() {
  const ex = state.workouts[editWorkoutIdx].exercises[editExerciseIdx];
  ex.sets = parseInt(document.getElementById('editExSets').value) || 3;
  ex.reps = document.getElementById('editExReps').value || '10 - 12';
  ex.rir = document.getElementById('editExRIR').value || '2 - 3';
  ex.rest = document.getElementById('editExRest').value || '90s';
  saveState();
  closeModal('modalEditEx');
  renderEdit();
}

function deleteExercise() {
  showConfirmDialog('Remover este exercício do treino?', () => {
    state.workouts[editWorkoutIdx].exercises.splice(editExerciseIdx, 1);
    saveState();
    closeModal('modalEditEx');
    renderEdit();
  });
}

// ====================== MODALS & CONFIRM ======================

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

let confirmCallback = null;
function showConfirmDialog(msg, callback) {
  document.getElementById('confirmMsg').textContent = msg;
  confirmCallback = callback;
  document.getElementById('confirmDialog').classList.add('active');
}
function confirmYes() {
  document.getElementById('confirmDialog').classList.remove('active');
  if (confirmCallback) confirmCallback();
  confirmCallback = null;
}
function confirmNo() {
  document.getElementById('confirmDialog').classList.remove('active');
  confirmCallback = null;
}

// ====================== UTILS ======================

function formatDate(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit' }) +
    ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

// ====================== INIT ======================

loadState();
renderHome();

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(ov => {
  ov.addEventListener('click', (e) => {
    if (e.target === ov) ov.classList.remove('active');
  });
});

// Populate muscle select for new exercises
setTimeout(populateNewExMuscleSelect, 100);

// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
